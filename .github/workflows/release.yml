name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default; only the release job that publishes gets contents: write.
permissions:
  contents: read

jobs:
  build:
    # The desktop zip bundles the console apps (same layout as build.ps1's CopyConsoleArtifacts)
    # so the guide's Copy buttons find them next to the exe.
    needs: [wii, n64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux AOT dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/AutoLUT.App/AutoLUT.App.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishAot=true \
            -o build/${{ matrix.rid }}

      - name: Remove debug symbols
        shell: bash
        run: rm -f build/${{ matrix.rid }}/*.pdb build/${{ matrix.rid }}/*.dbg

      - name: Bundle savestates
        shell: bash
        run: |
          mkdir -p build/${{ matrix.rid }}/savestates
          cp -r savestates/lut_gzs_1.0 savestates/lut_gzs_1.2 build/${{ matrix.rid }}/savestates/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wii-hbc
          path: build/${{ matrix.rid }}/wii

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: n64-rom
          path: console-n64

      - name: Bundle console apps
        shell: bash
        run: |
          test -f build/${{ matrix.rid }}/wii/apps/autolut-palette/boot.dol
          mkdir -p build/${{ matrix.rid }}/n64
          cp console-n64/AutoLUT-Palette-N64-*.z64 build/${{ matrix.rid }}/n64/autolut-palette.z64

      - name: Zip build
        shell: bash
        run: |
          cd build/${{ matrix.rid }}
          7z a -tzip "../AutoLUT-${{ github.ref_name }}-${{ matrix.rid }}.zip" "*"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.rid }}
          path: build/AutoLUT-${{ github.ref_name }}-${{ matrix.rid }}.zip
          if-no-files-found: error

  savestates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Zip savestates
        run: |
          cd savestates
          zip -r "../savestates-${{ github.ref_name }}.zip" lut_gzs_1.0 lut_gzs_1.2

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: savestates
          path: savestates-${{ github.ref_name }}.zip
          if-no-files-found: error

  wii:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest@sha256:44cb1a920e1ec3ec7c06767493c3b85f8d643d6137cc4661f0201895ac6e4967
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build homebrew
        run: make -C wii

      - name: Assemble HBC app folder
        run: |
          mkdir -p hbc/apps/autolut-palette
          cp wii/boot.dol wii/meta.xml hbc/apps/autolut-palette/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wii-hbc
          path: hbc/
          if-no-files-found: error

  n64:
    runs-on: ubuntu-latest
    container: ghcr.io/dragonminded/libdragon:latest@sha256:9fe2843c9b7289393c1885be62391140e8b4cdb3edbc715f202dea16f554c5d2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ROM
        run: sh n64/build.sh

      - name: Version ROM filename
        run: cp n64/autolut-palette.z64 "AutoLUT-Palette-N64-${{ github.ref_name }}.z64"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: n64-rom
          path: AutoLUT-Palette-N64-*.z64
          if-no-files-found: error

  release:
    needs: [build, savestates, wii, n64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Zip Wii HBC package
        run: |
          cd artifacts
          zip -r "AutoLUT-Palette-Wii-${{ github.ref_name }}.zip" apps
          rm -rf apps

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/*.zip
            artifacts/*.z64
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ''
