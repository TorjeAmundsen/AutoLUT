name: Deploy to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish browser app
        run: dotnet publish src/AutoLUT.Browser -c Release

      # Serve the exact console binaries attached to the release instead of rebuilding them,
      # so the site's downloads are byte-identical to the release assets. Manual runs have no
      # release event and take the latest release.
      - name: Download console binaries from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release download $TAG --repo "${{ github.repository }}" --dir release-assets --pattern 'AutoLUT-Palette-*'

      - name: Assemble site
        run: |
          SITE=src/AutoLUT.Browser/bin/Release/net10.0-browser/publish/wwwroot
          # Jekyll would drop the _framework directory without this.
          touch "$SITE/.nojekyll"
          cd savestates
          zip -r "../$SITE/savestates-1.0.zip" lut_gzs_1.0
          zip -r "../$SITE/savestates-1.2.zip" lut_gzs_1.2
          cd ..
          cp release-assets/AutoLUT-Palette-Wii-*.zip "$SITE/AutoLUT-Palette-Wii.zip"
          cp release-assets/AutoLUT-Palette-N64-*.z64 "$SITE/AutoLUT-Palette-N64.z64"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src/AutoLUT.Browser/bin/Release/net10.0-browser/publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
